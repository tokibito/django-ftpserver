[tox]
envlist =
  py{311,312,313,314}-dj52,
  py{312,313,314}-dj60,
  py{312,313,314}-dj61,
  coverage,
  ruff

[gh-actions]
python =
    3.11: py311
    3.12: py312, ruff
    3.13: py313
    3.14: py314, coverage

[testenv]
commands = pytest
setenv =
  PYTHONDONTWRITEBYTECODE=1
  PYTHONWARNINGS=once
deps =
  dj52: Django>=5.2,<5.3
  dj60: Django>=6.0,<6.1
  dj61: Django>=6.1,<6.2
  pyftpdlib
  pytest
  pytest-django

[testenv:coverage]
basepython = python3.14
deps =
  django>=5.2,<5.3
  coverage
  pytest-cov
  {[testenv]deps}
commands =
  pytest --cov=django_ftpserver

[testenv:ruff]
skip_install = true
basepython = python3.12
deps =
  ruff
commands =
  ruff check django_ftpserver/ tests/ example/
  ruff format --check django_ftpserver/ tests/ example/
